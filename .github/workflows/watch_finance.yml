name: Global Finance & Taiwan Market Monitor

on:
  schedule:
    - cron: '0 * * * *'  # 每小時整點自動巡檢一次
  workflow_dispatch:     # 允許手動點擊立即測試

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install google-genai requests edge-tts pillow

      - name: Run Global Finance Monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          python finance_monitor.py 2>&1 | tee error.log

      - name: Commit updated seen_finance.json
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_finance.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen finance news" && git push)

      # --- 失敗時全自動修復、直接推回 main 並重跑驗證（零衝突、免手動 Merge） ---
      - name: Auto-Fix and Push Directly to Main
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python debug_agent.py
          git config --local user.email "action@github.com"
          git config --local user.name "AI Debug Agent"
          git add finance_monitor.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix(auto-heal): patch finance_monitor.py automatically" && git push)
          echo "🔄 重新執行修復後的 finance_monitor.py 驗證..."
          python finance_monitor.py
