name: Global Finance & Taiwan Market Monitor

on:
  schedule:
    - cron: '0 * * * *'  # 每小時整點自動巡檢一次
  workflow_dispatch:     # 允許手動點擊立即測試

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install google-genai requests edge-tts pillow

      - name: Run Global Finance Monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          python finance_monitor.py 2>&1 | tee error.log

      - name: Commit updated seen_finance.json
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_finance.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen finance news" && git push)

      - name: Run Auto-Debug Agent on Failure
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python debug_agent.py

      - name: Create Pull Request with AI Fix
        if: failure()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: auto-patch finance_monitor.py by AI Debug Agent"
          title: "🤖 [Auto-Debug] AI 修復 finance_monitor.py (#${{ github.run_number }})"
          body-path: pr_body.md
          branch: ai-hotfix/finance-${{ github.run_id }}
          add-paths: |
            finance_monitor.py
            pr_body.md
          delete-branch: true
